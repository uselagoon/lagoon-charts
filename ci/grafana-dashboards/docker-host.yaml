              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 19,
          "type": "timeseries",
          "title": "Container action p95 latency",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 35
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (le, action) (rate(engine_daemon_container_actions_seconds_bucket{namespace=~\"$namespace\", service=~\"$dockerhost-metrics\"}[$__rate_interval])))",
              "legendFormat": "{{action}}",
              "refId": "A",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": {
