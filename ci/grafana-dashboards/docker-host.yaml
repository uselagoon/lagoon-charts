              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 20,
          "type": "timeseries",
          "title": "Engine events (rate)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 35
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (pod) (rate(engine_daemon_events_total{namespace=~\"$namespace\", service=~\"$dockerhost-metrics\"}[$__rate_interval]))",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
