apiVersion: v1
kind: ConfigMap
metadata:
  name: lagoon-api-dashboard
  labels:
    grafana_dashboard: "1"
data:
   lagoon-api-dashboard.json: |-
    {
      "title": "Lagoon API Dashboard",
      "uid": "lagoon-api-dashboard",
      "tags": [
        "lagoon",
        "api"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "label": "Data source"
          },
          {
            "name": "job",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "label": "Job",
            "includeAll": true,
            "multi": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "query": {
              "query": "label_values(lagoon_api_graphql_operations_total, job)",
              "refId": "job"
            },
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Total operations/s",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(lagoon_api_graphql_operations_total{job=~\"$job\"}[$__rate_interval]))",
              "legendFormat": "ops/s",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 2,
          "title": "Error ratio",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(lagoon_api_graphql_operations_total{job=~\"$job\",status=\"error\"}[$__rate_interval])) / sum(rate(lagoon_api_graphql_operations_total{job=~\"$job\"}[$__rate_interval]))",
              "legendFormat": "errors",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 3,
          "title": "Active users (5m)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(sum by (user) (increase(lagoon_api_graphql_user_operations_total{job=~\"$job\"}[5m])) > 0)",
              "legendFormat": "users",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 4,
          "title": "p95 latency",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(lagoon_api_graphql_operation_duration_seconds_bucket{job=~\"$job\"}[$__rate_interval])))",
              "legendFormat": "p95",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 5,
          "title": "Operations/s by type",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (operation_type) (rate(lagoon_api_graphql_operations_total{job=~\"$job\"}[$__rate_interval]))",
              "legendFormat": "{{operation_type}}",
              "refId": "A",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            }
          }
        },
        {
          "id": 6,
          "title": "Operations/s by status",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (status) (rate(lagoon_api_graphql_operations_total{job=~\"$job\"}[$__rate_interval]))",
              "legendFormat": "{{status}}",
              "refId": "A",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            }
          }
        },
        {
          "id": 7,
          "title": "Top 10 users by operations/s",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "topk(10, sum by (user) (rate(lagoon_api_graphql_user_operations_total{job=~\"$job\"}[$__rate_interval])))",
              "legendFormat": "{{user}}",
              "refId": "A",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            }
          }
        },
        {
          "id": 8,
          "title": "Top 10 root fields by operations/s",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 13,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "topk(10, sum by (root_fields) (rate(lagoon_api_graphql_operations_total{job=~\"$job\"}[$__rate_interval])))",
              "legendFormat": "{{root_fields}}",
              "refId": "A",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            }
          }
        },
        {
          "id": 9,
          "title": "Per-user rate vs 1 day ago (unusual activity)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 22,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "topk(10, sum by (user) (rate(lagoon_api_graphql_user_operations_total{job=~\"$job\"}[15m])) / (sum by (user) (rate(lagoon_api_graphql_user_operations_total{job=~\"$job\"}[15m] offset 1d)) > 0.001))",
              "legendFormat": "{{user}}",
              "refId": "A",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "x"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            }
          }
        },
        {
          "id": 10,
          "title": "Operations/s by auth type",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 22,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (auth_type) (rate(lagoon_api_graphql_user_operations_total{job=~\"$job\"}[$__rate_interval]))",
              "legendFormat": "{{auth_type}}",
              "refId": "A",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            }
          }
        },
        {
          "id": 11,
          "title": "Latency p50/p95/p99",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 31,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.5, sum by (le) (rate(lagoon_api_graphql_operation_duration_seconds_bucket{job=~\"$job\"}[$__rate_interval])))",
              "legendFormat": "p50",
              "refId": "A",
              "instant": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(lagoon_api_graphql_operation_duration_seconds_bucket{job=~\"$job\"}[$__rate_interval])))",
              "legendFormat": "p95",
              "refId": "B",
              "instant": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(lagoon_api_graphql_operation_duration_seconds_bucket{job=~\"$job\"}[$__rate_interval])))",
              "legendFormat": "p99",
              "refId": "C",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            }
          }
        },
        {
          "id": 12,
          "title": "Users, last 1h (ops/s)",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 31,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sort_desc(sum by (user, auth_type) (rate(lagoon_api_graphql_user_operations_total{job=~\"$job\"}[1h])))",
              "legendFormat": "",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "sortBy": [
              {
                "displayName": "ops/s",
                "desc": true
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value": "ops/s"
                }
              }
            }
          ]
        },
        {
          "id": 13,
          "title": "Top 10 users by permission denied/s",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 39,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "topk(10, sum by (user) (rate(lagoon_api_graphql_permission_denied_total{job=~\"$job\"}[$__rate_interval])))",
              "legendFormat": "{{user}}",
              "refId": "A",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            }
          }
        },
        {
          "id": 14,
          "title": "Permission denied/s by scope;resource",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 39,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (scope, resource) (rate(lagoon_api_graphql_permission_denied_total{job=~\"$job\"}[$__rate_interval]))",
              "legendFormat": "{{scope}};{{resource}}",
              "refId": "A",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            }
          }
        },
        {
          "id": 15,
          "title": "Denial ratio per user (denied / operations)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 48,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "topk(10, sum by (user) (rate(lagoon_api_graphql_permission_denied_total{job=~\"$job\"}[15m])) / sum by (user) (rate(lagoon_api_graphql_user_operations_total{job=~\"$job\"}[15m])))",
              "legendFormat": "{{user}}",
              "refId": "A",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            }
          }
        },
        {
          "id": 16,
          "title": "Denied by user and scope, last 1h",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 48,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sort_desc(sum by (user, scope, resource, auth_type) (rate(lagoon_api_graphql_permission_denied_total{job=~\"$job\"}[1h])))",
              "legendFormat": "",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {},
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value": "denied/s"
                }
              }
            }
          ]
        },
        {
          "id": 17,
          "title": "Top 10 users by fields selected/s (complexity)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 57,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "topk(10, sum by (user) (rate(lagoon_api_graphql_user_fields_total{job=~\"$job\"}[$__rate_interval])))",
              "legendFormat": "{{user}}",
              "refId": "A",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            }
          }
        },
        {
          "id": 18,
          "title": "Operation depth p50/p95/p99",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 57,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.5, sum by (le) (rate(lagoon_api_graphql_operation_depth_bucket{job=~\"$job\"}[$__rate_interval])))",
              "legendFormat": "p50",
              "refId": "A",
              "instant": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(lagoon_api_graphql_operation_depth_bucket{job=~\"$job\"}[$__rate_interval])))",
              "legendFormat": "p95",
              "refId": "B",
              "instant": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(lagoon_api_graphql_operation_depth_bucket{job=~\"$job\"}[$__rate_interval])))",
              "legendFormat": "p99",
              "refId": "C",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            }
          }
        },
        {
          "id": 19,
          "title": "Operation field count p50/p95/p99",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 66,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.5, sum by (le) (rate(lagoon_api_graphql_operation_field_count_bucket{job=~\"$job\"}[$__rate_interval])))",
              "legendFormat": "p50",
              "refId": "A",
              "instant": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(lagoon_api_graphql_operation_field_count_bucket{job=~\"$job\"}[$__rate_interval])))",
              "legendFormat": "p95",
              "refId": "B",
              "instant": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(lagoon_api_graphql_operation_field_count_bucket{job=~\"$job\"}[$__rate_interval])))",
              "legendFormat": "p99",
              "refId": "C",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            }
          }
        },
        {
          "id": 20,
          "title": "Response size p50/p95/p99",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 66,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.5, sum by (le) (rate(lagoon_api_graphql_response_size_bytes_bucket{job=~\"$job\"}[$__rate_interval])))",
              "legendFormat": "p50",
              "refId": "A",
              "instant": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
