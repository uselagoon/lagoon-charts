{{- if and .Values.dockerHostOperator.enabled .Values.dockerHostOperator.metricsService.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lagoon-remote.dockerHostOperator.fullname" . }}-metrics
  labels:
    metrics-only: "true"
    {{- include "lagoon-remote.dockerHostOperator.labels" . | nindent 4 }}
spec:
  type: {{ .Values.dockerHostOperator.metricsService.type }}
  ports:
  - port: {{ .Values.dockerHostOperator.metricsService.ports.metrics }}
    targetPort: https
    protocol: TCP
    name: https
  selector:
    {{- include "lagoon-remote.dockerHostOperator.selectorLabels" . | nindent 4 }}
{{- end }}
